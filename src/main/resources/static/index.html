<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Carros</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
    <h1>Loja de Carros</h1>
    <nav>
        <button onclick="mostrarAba('carros')">Carros</button>
        <button onclick="mostrarAba('usuarios')">Usuários</button>
    </nav>
</header>

<main>
    <section id="carros" class="aba">
        <h2>Carros</h2>
        <p>Os recursos de carros existentes continuam disponíveis pela API.</p>
        <p>Use a aba <strong>Usuários</strong> para administrar o CRUD de usuários.</p>
    </section>

    <section id="usuarios" class="aba escondida">
        <h2>Cadastro de Usuário</h2>

        <form id="usuarioForm">
            <input type="hidden" id="usuarioId">

            <label>Nome</label>
            <input type="text" id="nome" required>

            <label>E-mail</label>
            <input type="email" id="email" required>

            <label>Senha</label>
            <input type="password" id="senha" required>

            <div class="acoes">
                <button type="submit">Salvar</button>
                <button type="button" onclick="limparFormulario()">Limpar</button>
            </div>
        </form>

        <h2>Usuários cadastrados</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="usuariosTabela"></tbody>
        </table>
    </section>
</main>

<script src="/app.js"></script>
</body>
</html>
